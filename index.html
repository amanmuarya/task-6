<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

<div class="left-section">
    <img src="pic.avif" alt="Washing Machine Illustration"   class="illustration">
              
        </div>
        <div class="right-section">
 <div class="form-container">
                <div class="form-header">
                    <h1>Hello Sir </h1>
 <p>Welcome back we missed you!</p>
                </div>

    <form action="#">
    <div class="input-group">
     <label for="email">Email</label>
      <input type="email" id="email" placeholder="Emailid@site.com" required>
                    </div>

    <div class="input-group">
     <label for="password">Password</label>
                       
     <input type="password" id="password" placeholder="Password" required>
     </div>

       <div class="forgot-password"> <a href="#">Forgot Password?</a>
     </div>

        <button type="submit" class="login-btn">Login</button>

            <div class="register-link">
  <p>Not a member? <a href="#">Register Now</a></p>
     </div>
         </form>
</div>
      </div>
    </div>
</body>
</html>
